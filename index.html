<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拂尘见秦腔 · 实时唤醒</title>
    <style>
        :root {
            --bg: #0d0a0f;
            --panel-bg: rgba(18, 12, 22, 0.9);
            --text: #c8b8a8;
            --gold: #c49a4c;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        canvas#mainCanvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(60, 30, 20, 0.4), 0 0 150px rgba(30, 15, 10, 0.35);
            max-width: 100vw;
            max-height: 80vh;
            aspect-ratio: 4/3;
            object-fit: contain;
            transition: box-shadow 0.8s ease;
        }
        canvas#mainCanvas.bloom-active {
            box-shadow: 0 0 100px rgba(200, 140, 40, 0.7), 0 0 250px rgba(180, 100, 30, 0.5);
        }
        .control-panel {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            padding: 12px 18px;
            border-radius: 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(160, 120, 80, 0.3);
            z-index: 10;
        }
        .btn {
            padding: 9px 16px;
            border-radius: 24px;
            border: 1.5px solid rgba(160, 120, 80, 0.4);
            background: rgba(25, 16, 12, 0.75);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            background: rgba(50, 30, 20, 0.8);
            border-color: rgba(200, 150, 90, 0.7);
            color: #f0e0d0;
        }
        .btn.primary {
            background: rgba(120, 70, 35, 0.65);
            border-color: rgba(200, 130, 60, 0.65);
            color: #f5e0c8;
            font-weight: 500;
        }
        .btn.primary:hover {
            background: rgba(150, 85, 40, 0.75);
            border-color: rgba(230, 150, 70, 0.85);
        }
        .btn.active-state {
            background: rgba(160, 90, 40, 0.7);
            border-color: rgba(240, 160, 70, 0.85);
            animation: btnPulse 2s infinite;
            color: #ffe8d0;
        }
        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 0 14px rgba(200, 120, 45, 0.5);
            }
            50% {
                box-shadow: 0 0 30px rgba(240, 150, 55, 0.8);
            }
        }
        .btn-file {
            cursor: pointer;
            position: relative;
        }
        .btn-file input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a3020;
            transition: 0.5s;
        }
        .status-dot.active {
            background: #c89050;
            box-shadow: 0 0 12px rgba(200, 130, 60, 0.8);
            animation: dotGlow 1.6s infinite;
        }
        @keyframes dotGlow {
            0%,
            100% {
                box-shadow: 0 0 7px rgba(200, 130, 60, 0.5);
            }
            50% {
                box-shadow: 0 0 18px rgba(240, 160, 70, 1);
            }
        }
        .hint-overlay {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(180, 150, 120, 0.75);
            font-size: 14px;
            letter-spacing: 1.5px;
            pointer-events: none;
            text-align: center;
            line-height: 1.7;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }
        @media (max-width: 768px) {
            .control-panel {
                bottom: 8px;
                padding: 10px 12px;
                gap: 6px;
                border-radius: 28px;
            }
            .btn {
                padding: 7px 12px;
                font-size: 11px;
                border-radius: 20px;
            }
            canvas#mainCanvas {
                border-radius: 8px;
                max-height: 72vh;
            }
            .hint-overlay {
                font-size: 12px;
                top: 14%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <canvas id="mainCanvas"></canvas>
        <div class="hint-overlay" id="hintText">✦ 举起手掌 · 拂去尘埃 ✦<br>双手合拢 · 唤醒秦腔</div>
        <div class="control-panel">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel" style="font-size:11px; color:#a89078;">等待启程</span>
            <button class="btn primary" id="btnStart">✨ 启程</button>
            <label class="btn btn-file" title="上传底图（尘封文物）">🏚️ 底图<input type="file" id="uploadBase" accept="image/*"></label>
            <label class="btn btn-file" title="上传蒙版（华丽盔头）">🎭 蒙版<input type="file" id="uploadMask" accept="image/*"></label>
            <button class="btn" id="btnToggleCam" title="切换摄像头">📷 翻转</button>
            <button class="btn" id="btnToggleMusic" title="音乐开关">🎵</button>
            <button class="btn" id="btnReset">↺ 重置</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js">
    </script>

    <script>
        (function() {
            // ==================== DOM元素 ====================
            const mainCanvas = document.getElementById('mainCanvas');
            const mainCtx = mainCanvas.getContext('2d');
            const btnStart = document.getElementById('btnStart');
            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');
            const hintText = document.getElementById('hintText');
            const appContainer = document.getElementById('appContainer');
            const uploadBase = document.getElementById('uploadBase');
            const uploadMask = document.getElementById('uploadMask');
            const btnReset = document.getElementById('btnReset');
            const btnToggleCam = document.getElementById('btnToggleCam');
            const btnToggleMusic = document.getElementById('btnToggleMusic');

            // ==================== 状态变量 ====================
            let canvasWidth = 800;
            let canvasHeight = 600;
            let isRunning = false;
            let handsInstance = null;
            let videoElement = null;
            let cameraStream = null;
            let facingMode = 'user'; // 默认前置摄像头
            let userBaseImage = null;
            let userMaskImage = null;
            let musicEnabled = true;
            let audioCtx = null;
            let lastFrameTime = 0;

            let detectedHands = [];
            let smoothApertures = [];
            let targetApertures = [];
            let dustParticles = [];
            let glowParticles = [];
            let bloomParticles = [];
            const MAX_DUST = 250;
            const MAX_GLOW = 180;
            const MAX_BLOOM = 300;

            let baseCanvas, baseCtx, maskCanvas, maskCtx, memoryCanvas, memoryCtx, tempCanvas, tempCtx;
            let bloomState = { active: false, startTime: 0, duration: 4500, intensity: 0 };

            // ==================== Canvas初始化 ====================
            function resizeCanvas() {
                const containerW = appContainer.clientWidth;
                const containerH = appContainer.clientHeight;
                const aspectRatio = 4 / 3;
                let w, h;
                if (containerW / containerH > aspectRatio) {
                    h = Math.min(containerH * 0.82, 700);
                    w = h * aspectRatio;
                } else {
                    w = Math.min(containerW * 0.94, 960);
                    h = w / aspectRatio;
                }
                canvasWidth = Math.floor(w);
                canvasHeight = Math.floor(h);
                mainCanvas.width = canvasWidth;
                mainCanvas.height = canvasHeight;
                rebuildOffscreenCanvases();
            }

            function rebuildOffscreenCanvases() {
                if (!baseCanvas) baseCanvas = document.createElement('canvas');
                if (!maskCanvas) maskCanvas = document.createElement('canvas');
                if (!memoryCanvas) memoryCanvas = document.createElement('canvas');
                if (!tempCanvas) tempCanvas = document.createElement('canvas');

                baseCanvas.width = maskCanvas.width = memoryCanvas.width = tempCanvas.width = canvasWidth;
                baseCanvas.height = maskCanvas.height = memoryCanvas.height = tempCanvas.height = canvasHeight;

                baseCtx = baseCanvas.getContext('2d');
                maskCtx = maskCanvas.getContext('2d');
                memoryCtx = memoryCanvas.getContext('2d');
                tempCtx = tempCanvas.getContext('2d');

                memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);

                if (!userBaseImage) generateDustyRelic(baseCtx, canvasWidth, canvasHeight);
                else drawImageCover(baseCtx, userBaseImage, canvasWidth, canvasHeight, true);

                if (!userMaskImage) generateGloriousHelmet(maskCtx, canvasWidth, canvasHeight);
                else drawImageCover(maskCtx, userMaskImage, canvasWidth, canvasHeight, false);
            }

            function drawImageCover(ctx, img, w, h, isBase) {
                const iw = img.naturalWidth || img.width;
                const ih = img.naturalHeight || img.height;
                const scale = Math.max(w / iw, h / ih);
                const sw = w / scale;
                const sh = h / scale;
                const sx = (iw - sw) / 2;
                const sy = (ih - sh) / 2;
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
                if (isBase) addDustOverlay(ctx, w, h);
            }

            function addDustOverlay(ctx, w, h) {
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 30;
                    const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                    const dustFactor = 0.25 + Math.random() * 0.2;
                    data[i] = Math.min(255, Math.max(0, data[i] * (1 - dustFactor) + gray * dustFactor + noise));
                    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] * (1 - dustFactor) + gray * dustFactor +
                    noise));
                    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] * (1 - dustFactor) + gray * dustFactor +
                    noise));
                }
                ctx.putImageData(imageData, 0, 0);
                addCobwebTexture(ctx, w, h);
            }

            function addCobwebTexture(ctx, w, h) {
                ctx.strokeStyle = 'rgba(200,190,175,0.12)';
                ctx.lineWidth = 0.4;
                for (let wb = 0; wb < 8; wb++) {
                    const cx = Math.random() * w;
                    const cy = Math.random() * h * 0.7;
                    const radius = 30 + Math.random() * 100;
                    ctx.beginPath();
                    for (let s = 0; s <= 12; s++) {
                        const angle = (s / 12) * Math.PI * 2;
                        const r = radius * (0.4 + Math.random() * 0.6);
                        const sx = cx + Math.cos(angle) * r;
                        const sy = cy + Math.sin(angle) * r;
                        if (s === 0) ctx.moveTo(sx, sy);
                        else ctx.lineTo(sx, sy);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            }

            // ==================== 程序化生成图像 ====================
            function generateDustyRelic(ctx, w, h) {
                const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
                bgGrad.addColorStop(0, '#2a2218');
                bgGrad.addColorStop(0.5, '#1a1410');
                bgGrad.addColorStop(1, '#0f0c09');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                for (let i = 0; i < 200; i++) {
                    ctx.fillStyle =
                        `rgba(${30+Math.random()*40},${20+Math.random()*30},${15+Math.random()*25},${0.03+Math.random()*0.08})`;
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, Math.random() * h, 2 + Math.random() * 18, 0, Math.PI * 2);
                    ctx.fill();
                }

                drawHelmetShape(ctx, w, h, true);

                const dustGrad = ctx.createLinearGradient(0, 0, 0, h);
                dustGrad.addColorStop(0, 'rgba(140,120,100,0.35)');
                dustGrad.addColorStop(0.5, 'rgba(100,88,75,0.45)');
                dustGrad.addColorStop(1, 'rgba(80,70,60,0.5)');
                ctx.fillStyle = dustGrad;
                ctx.fillRect(0, 0, w, h);
                addCobwebTexture(ctx, w, h);
            }

            function generateGloriousHelmet(ctx, w, h) {
                const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.35, w * 0.05, w * 0.5, h * 0.5, w * 0.9);
                bgGrad.addColorStop(0, '#3a2a18');
                bgGrad.addColorStop(0.6, '#1f1810');
                bgGrad.addColorStop(1, '#0c0806');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                drawHelmetShape(ctx, w, h, false);

                for (let i = 0; i < 60; i++) {
                    const px = w * 0.3 + Math.random() * w * 0.4;
                    const py = h * 0.15 + Math.random() * h * 0.45;
                    const grad = ctx.createRadialGradient(px, py, 0, px, py, 2 + Math.random() * 6);
                    grad.addColorStop(0, `rgba(255,240,210,${0.15+Math.random()*0.4})`);
                    grad.addColorStop(1, 'rgba(255,180,100,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(px, py, 2 + Math.random() * 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawHelmetShape(ctx, w, h, isDusty) {
                const cx = w * 0.5;
                const cy = h * 0.32;
                const helmetW = w * 0.38;
                const helmetH = h * 0.5;

                const colors = isDusty ? {
                    body: '#8a7a6a',
                    bodyDark: '#6b5d50',
                    gold: '#9e8b72',
                    blue: '#7a7065',
                    red: '#8a6a5a',
                    jewel: '#a09080'
                } : {
                    body: '#1a0d05',
                    bodyDark: '#0d0603',
                    gold: '#d4a030',
                    blue: '#1a5c8a',
                    red: '#c83020',
                    jewel: '#e8d8b0'
                };

                // 帽体
                const bodyGrad = ctx.createRadialGradient(cx, cy - helmetH * 0.1, helmetW * 0.15, cx, cy, helmetW * 0.55);
                bodyGrad.addColorStop(0, colors.body);
                bodyGrad.addColorStop(0.6, colors.bodyDark);
                bodyGrad.addColorStop(1, '#0a0604');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(cx, cy, helmetW * 0.48, helmetH * 0.42, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = colors.gold;
                ctx.lineWidth = isDusty ? 2.5 : 3.5;
                ctx.beginPath();
                ctx.ellipse(cx, cy, helmetW * 0.48, helmetH * 0.42, 0, 0, Math.PI * 2);
                ctx.stroke();

                // 点翠
                for (let i = 0; i < 5; i++) {
                    const angle = -Math.PI * 0.55 + (i / 4) * Math.PI * 1.1;
                    const dx = Math.cos(angle) * helmetW * 0.32;
                    const dy = Math.sin(angle) * helmetH * 0.28;
                    ctx.fillStyle = colors.blue;
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dy, helmetW * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绒球
                ctx.fillStyle = colors.red;
                ctx.beginPath();
                ctx.arc(cx, cy - helmetH * 0.38, helmetW * 0.12, 0, Math.PI * 2);
                ctx.fill();

                // 珠宝
                ctx.fillStyle = colors.jewel;
                ctx.beginPath();
                ctx.arc(cx, cy - helmetH * 0.22, helmetW * 0.04, 0, Math.PI * 2);
                ctx.fill();
            }

            // ==================== MediaPipe Hands ====================
            async function initMediaPipe() {
                if (handsInstance) {
                    try { handsInstance.close(); } catch (e) {}
                    handsInstance = null;
                }

                handsInstance = new Hands({
                    locateFile: (file) =>
                        `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`,
                });

                handsInstance.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.6,
                });

                handsInstance.onResults(onHandResults);

                if (!videoElement) {
                    videoElement = document.createElement('video');
                    videoElement.setAttribute('playsinline', '');
                    videoElement.setAttribute('muted', '');
                    videoElement.style.display = 'none';
                    document.body.appendChild(videoElement);
                }

                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                }

                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: facingMode,
                        },
                        audio: false,
                    });
                    videoElement.srcObject = cameraStream;
                    await videoElement.play();
                } catch (err) {
                    console.warn('首选摄像头不可用，尝试备用:', err.message);
                    const fallbackMode = facingMode === 'environment' ? 'user' : 'environment';
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: fallbackMode,
                        },
                        audio: false,
                    });
                    videoElement.srcObject = cameraStream;
                    await videoElement.play();
                    facingMode = fallbackMode;
                }

                statusDot.classList.add('active');
                statusLabel.textContent = '文物已连接';
                isRunning = true;
                hintText.style.opacity = '0.45';
                lastFrameTime = performance.now();
                detectedHands = [];
                smoothApertures = [];
                targetApertures = [];
                dustParticles = [];
                glowParticles = [];
                bloomParticles = [];
                bloomState.active = false;
                bloomState.intensity = 0;
                memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);

                startDetectionLoop();
                requestAnimationFrame(render);
            }

            function onHandResults(results) {
                const now = performance.now();
                const hands = [];

                if (results.multiHandLandmarks && results.multiHandedness) {
                    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                        const landmarks = results.multiHandLandmarks[i];
                        const handedness = results.multiHandedness[i].label;

                        const wrist = landmarks[0];
                        const midPalm = landmarks[9];
                        const pinkyPalm = landmarks[17];
                        const cx = (wrist.x + midPalm.x + pinkyPalm.x) / 3;
                        const cy = (wrist.y + midPalm.y + pinkyPalm.y) / 3;

                        let minX = Infinity,
                            minY = Infinity,
                            maxX = -Infinity,
                            maxY = -Infinity;
                        landmarks.forEach(lm => {
                            if (lm.x < minX) minX = lm.x;
                            if (lm.y < minY) minY = lm.y;
                            if (lm.x > maxX) maxX = lm.x;
                            if (lm.y > maxY) maxY = lm.y;
                        });
                        const handSize = Math.sqrt((maxX - minX) ** 2 + (maxY - minY) ** 2);

                        const thumbTip = landmarks[4];
                        const indexTip = landmarks[8];
                        const pinchDist = Math.sqrt((thumbTip.x - indexTip.x) ** 2 + (thumbTip.y - indexTip.y) **
                            2);

                        hands.push({
                            handedness,
                            center: { x: cx, y: cy },
                            size: handSize,
                            pinchDist,
                            landmarks,
                        });
                    }
                }

                detectedHands = hands;
                updateTargetApertures();
            }

            function updateTargetApertures() {
                targetApertures = detectedHands.map(hand => {
                    // 无镜像：直接使用MediaPipe的x坐标（前置摄像头MediaPipe已经做了镜像处理）
                    const cx = hand.center.x * canvasWidth;
                    const cy = hand.center.y * canvasHeight;
                    const baseRadius = hand.size * canvasWidth * 1.5;
                    let radius = Math.max(50, Math.min(240, baseRadius));

                    if (hand.pinchDist < hand.size * 0.25) {
                        radius *= 0.65;
                    }

                    return {
                        cx,
                        cy,
                        radius,
                        handId: hand.handedness,
                        pinchDist: hand.pinchDist,
                        rawHand: hand,
                    };
                });

                if (smoothApertures.length === 0 && targetApertures.length > 0) {
                    smoothApertures = targetApertures.map(t => ({ ...t }));
                }
            }

            function smoothApertureUpdate(dt) {
                const targetIds = targetApertures.map(t => t.handId);
                smoothApertures = smoothApertures.filter(s => targetIds.includes(s.handId));

                const map = {};
                smoothApertures.forEach(s => { map[s.handId] = s; });

                const newSmooth = [];
                targetApertures.forEach(target => {
                    let s = map[target.handId];
                    if (!s) {
                        s = { ...target };
                    }
                    const lerp = Math.min(1, dt * 9);
                    s.cx += (target.cx - s.cx) * lerp;
                    s.cy += (target.cy - s.cy) * lerp;
                    s.radius += (target.radius - s.radius) * lerp;
                    s.pinchDist = target.pinchDist;
                    s.rawHand = target.rawHand;
                    newSmooth.push(s);
                });

                smoothApertures = newSmooth;
            }

            // ==================== 粒子系统 ====================
            function spawnDustParticle(cx, cy, radius) {
                const angle = Math.random() * Math.PI * 2;
                const dist = radius * (0.5 + Math.random() * 0.5);
                dustParticles.push({
                    x: cx + Math.cos(angle) * dist,
                    y: cy + Math.sin(angle) * dist,
                    vx: (Math.random() - 0.5) * 30,
                    vy: (Math.random() - 0.5) * 30 - 15,
                    life: 1,
                    maxLife: 1.5 + Math.random() * 3,
                    size: 0.8 + Math.random() * 3,
                    r: 140 + Math.random() * 60,
                    g: 115 + Math.random() * 50,
                    b: 90 + Math.random() * 45,
                });
            }

            function spawnGlowParticle(cx, cy, radius) {
                const angle = Math.random() * Math.PI * 2;
                const dist = radius * (0.6 + Math.random() * 0.4);
                glowParticles.push({
                    x: cx + Math.cos(angle) * dist,
                    y: cy + Math.sin(angle) * dist,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20 - 10,
                    life: 1,
                    maxLife: 0.8 + Math.random() * 2,
                    size: 0.5 + Math.random() * 2.5,
                    r: 240 + Math.random() * 15,
                    g: 180 + Math.random() * 40,
                    b: 50 + Math.random() * 60,
                });
            }

            function spawnBloomParticle(cx, cy, radius) {
                bloomParticles.push({
                    x: cx + (Math.random() - 0.5) * radius * 1.2,
                    y: cy + (Math.random() - 0.5) * radius * 1.2,
                    vx: (Math.random() - 0.5) * 50,
                    vy: (Math.random() - 0.5) * 50 - 25,
                    life: 1,
                    maxLife: 1.8 + Math.random() * 3.5,
                    size: 1.5 + Math.random() * 5,
                    r: 255,
                    g: 180 + Math.random() * 75,
                    b: 60 + Math.random() * 100,
                });
            }

            function updateParticles(dt) {
                [dustParticles, glowParticles, bloomParticles].forEach(arr => {
                    arr.forEach(p => {
                        p.life -= dt / p.maxLife;
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.vy += 20 * dt;
                        p.size *= 0.997;
                    });
                });

                dustParticles = dustParticles.filter(p => p.life > 0);
                glowParticles = glowParticles.filter(p => p.life > 0);
                bloomParticles = bloomParticles.filter(p => p.life > 0);

                if (dustParticles.length > MAX_DUST) dustParticles.splice(0, dustParticles.length - MAX_DUST);
                if (glowParticles.length > MAX_GLOW) glowParticles.splice(0, glowParticles.length - MAX_GLOW);
                if (bloomParticles.length > MAX_BLOOM) bloomParticles.splice(0, bloomParticles.length - MAX_BLOOM);
            }

            // ==================== 渲染 ====================
            function render(timestamp) {
                if (!isRunning) {
                    requestAnimationFrame(render);
                    return;
                }

                const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
                lastFrameTime = timestamp;

                smoothApertureUpdate(dt);
                updateTargetApertures();
                smoothApertureUpdate(dt);
                checkBloomState(dt, timestamp);

                // 绘制光圈到记忆层
                drawAperturesToMemory();

                // 记忆层衰减
                memoryCtx.globalCompositeOperation = 'destination-out';
                memoryCtx.globalAlpha = 0.005;
                memoryCtx.fillRect(0, 0, canvasWidth, canvasHeight);
                memoryCtx.globalAlpha = 1;
                memoryCtx.globalCompositeOperation = 'source-over';

                // 生成粒子
                smoothApertures.forEach(ap => {
                    if (Math.random() < 0.5) spawnDustParticle(ap.cx, ap.cy, ap.radius);
                    if (Math.random() < 0.3) spawnGlowParticle(ap.cx, ap.cy, ap.radius);
                });

                if (bloomState.active && bloomState.intensity > 0.3 && smoothApertures.length >= 2) {
                    const overlapC = getOverlapCenter();
                    if (overlapC) {
                        const spawnRate = bloomState.intensity * 30;
                        for (let i = 0; i < Math.floor(spawnRate * dt); i++) {
                            spawnBloomParticle(overlapC.cx, overlapC.cy, getOverlapRadius());
                        }
                    }
                }

                updateParticles(dt);

                // === 绘制主Canvas ===
                const ctx = mainCtx;
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);

                // 1. 底图
                ctx.drawImage(baseCanvas, 0, 0, canvasWidth, canvasHeight);

                // 2. 蒙版合成
                tempCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                tempCtx.drawImage(maskCanvas, 0, 0, canvasWidth, canvasHeight);
                tempCtx.globalCompositeOperation = 'destination-in';
                tempCtx.drawImage(memoryCanvas, 0, 0, canvasWidth, canvasHeight);
                tempCtx.globalCompositeOperation = 'source-over';
                ctx.drawImage(tempCanvas, 0, 0, canvasWidth, canvasHeight);

                // 3. 盛放态叠加
                if (bloomState.active && bloomState.intensity > 0.2 && smoothApertures.length >= 2) {
                    drawBloomOverlay(ctx);
                }

                // 4. 粒子
                drawAllParticles(ctx);

                // 更新盛放态
                if (bloomState.active && timestamp - bloomState.startTime > bloomState.duration) {
                    bloomState.active = false;
                    bloomState.intensity = 0;
                    mainCanvas.classList.remove('bloom-active');
                }
                if (bloomState.active) {
                    const elapsed = timestamp - bloomState.startTime;
                    const fadeStart = bloomState.duration * 0.7;
                    if (elapsed > fadeStart) {
                        bloomState.intensity = Math.max(0, 1 - (elapsed - fadeStart) / (bloomState.duration * 0.3));
                    }
                }

                requestAnimationFrame(render);
            }

            function drawAperturesToMemory() {
                smoothApertures.forEach(ap => {
                    const grad = memoryCtx.createRadialGradient(ap.cx, ap.cy, ap.radius * 0.6, ap.cx, ap.cy, ap.radius);
                    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
                    grad.addColorStop(0.6, 'rgba(255,255,255,0.6)');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    memoryCtx.fillStyle = grad;
                    memoryCtx.beginPath();
                    memoryCtx.arc(ap.cx, ap.cy, ap.radius, 0, Math.PI * 2);
                    memoryCtx.fill();
                });
            }

            function drawBloomOverlay(ctx) {
                if (smoothApertures.length < 2) return;
                const a0 = smoothApertures[0];
                const a1 = smoothApertures[1];
                const midX = (a0.cx + a1.cx) / 2;
                const midY = (a0.cy + a1.cy) / 2;
                const overlapR = Math.min(a0.radius, a1.radius) * 0.75;
                const intensity = bloomState.intensity;

                const glowGrad = ctx.createRadialGradient(midX, midY, overlapR * 0.2, midX, midY, overlapR * 2);
                glowGrad.addColorStop(0, `rgba(255,210,130,${0.7*intensity})`);
                glowGrad.addColorStop(0.5, `rgba(255,170,90,${0.4*intensity})`);
                glowGrad.addColorStop(1, 'rgba(255,90,30,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(midX, midY, overlapR * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawAllParticles(ctx) {
                dustParticles.forEach(p => {
                    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.life*0.6})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                glowParticles.forEach(p => {
                    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
                    glow.addColorStop(0, `rgba(${p.r},${p.g},${p.b},${p.life*0.8})`);
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                });

                bloomParticles.forEach(p => {
                    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
                    glow.addColorStop(0, `rgba(${p.r},${p.g},${p.b},${p.life*0.9})`);
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            function checkBloomState(dt, timestamp) {
                if (smoothApertures.length >= 2) {
                    const a0 = smoothApertures[0];
                    const a1 = smoothApertures[1];
                    const dx = a0.cx - a1.cx;
                    const dy = a0.cy - a1.cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const threshold = (a0.radius + a1.radius) * 0.5;

                    if (dist < threshold) {
                        if (!bloomState.active) {
                            bloomState.active = true;
                            bloomState.startTime = timestamp;
                            bloomState.intensity = 1;
                            mainCanvas.classList.add('bloom-active');
                            const midX = (a0.cx + a1.cx) / 2;
                            const midY = (a0.cy + a1.cy) / 2;
                            const overlapR = Math.min(a0.radius, a1.radius) * 0.7;
                            for (let i = 0; i < 70; i++) spawnBloomParticle(midX, midY, overlapR);
                            playBloomSound();
                        } else {
                            bloomState.intensity = Math.min(1, bloomState.intensity + dt * 1.8);
                            bloomState.startTime = timestamp;
                        }
                    } else if (bloomState.active && dist > threshold * 1.4) {
                        bloomState.intensity = Math.max(0, bloomState.intensity - dt * 2.5);
                        if (bloomState.intensity <= 0) {
                            bloomState.active = false;
                            bloomState.intensity = 0;
                            mainCanvas.classList.remove('bloom-active');
                        }
                    }
                } else if (bloomState.active && smoothApertures.length < 2) {
                    bloomState.intensity = Math.max(0, bloomState.intensity - dt * 3);
                    if (bloomState.intensity <= 0) {
                        bloomState.active = false;
                        bloomState.intensity = 0;
                        mainCanvas.classList.remove('bloom-active');
                    }
                }
            }

            function getOverlapCenter() {
                if (smoothApertures.length < 2) return null;
                const a0 = smoothApertures[0];
                const a1 = smoothApertures[1];
                const dx = a0.cx - a1.cx;
                const dy = a0.cy - a1.cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < a0.radius + a1.radius) {
                    return { cx: (a0.cx + a1.cx) / 2, cy: (a0.cy + a1.cy) / 2 };
                }
                return null;
            }

            function getOverlapRadius() {
                if (smoothApertures.length < 2) return 60;
                return Math.min(smoothApertures[0].radius, smoothApertures[1].radius) * 0.7;
            }

            // ==================== 检测循环 ====================
            async function startDetectionLoop() {
                while (isRunning) {
                    if (handsInstance && videoElement && videoElement.readyState >= 2) {
                        try {
                            await handsInstance.send({ image: videoElement });
                        } catch (e) {
                            console.warn('检测帧发送失败:', e.message);
                        }
                    }
                    await new Promise(r => setTimeout(r, 40));
                }
            }

            // ==================== Web Audio 音效系统 ====================
            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    createHealingMusic();
                    if (musicEnabled && isRunning) startMusic();
                } catch (e) {
                    console.warn('音频初始化失败:', e.message);
                    musicEnabled = false;
                }
            }

            function createHealingMusic() {
                if (!audioCtx) return;
                const masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.04;
                masterGain.connect(audioCtx.destination);

                // 基础氛围音
                const baseOsc = audioCtx.createOscillator();
                baseOsc.type = 'sine';
                baseOsc.frequency.value = 196;
                const baseGain = audioCtx.createGain();
                baseGain.gain.value = 0.2;
                baseOsc.connect(baseGain);
                baseGain.connect(masterGain);
                baseOsc.start();

                // 泛音
                const overtoneOsc = audioCtx.createOscillator();
                overtoneOsc.type = 'triangle';
                overtoneOsc.frequency.value = 294;
                const overtoneGain = audioCtx.createGain();
                overtoneGain.gain.value = 0.1;
                overtoneOsc.connect(overtoneGain);
                overtoneGain.connect(masterGain);
                overtoneOsc.start();

                // 存储引用以便清理
                window._audioNodes = { masterGain, baseOsc, overtoneOsc, baseGain, overtoneGain };
            }

            function startMusic() {
                if (!audioCtx || !window._audioNodes) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                window._audioNodes.masterGain.gain.setTargetAtTime(0.04, audioCtx.currentTime, 0.5);
            }

            function stopMusic() {
                if (!audioCtx || !window._audioNodes) return;
                window._audioNodes.masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
            }

            function playBloomSound() {
                if (!audioCtx || !musicEnabled) return;
                const now = audioCtx.currentTime;

                // 短促鼓声
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const t = i / audioCtx.sampleRate;
                    data[i] = (Math.random() - 0.5) * 2 * Math.exp(-t * 15) * 0.5;
                }
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                source.connect(gain);
                gain.connect(audioCtx.destination);
                source.start(now);
            }

            function toggleMusic() {
                musicEnabled = !musicEnabled;
                btnToggleMusic.textContent = musicEnabled ? '🎵' : '🔇';
                if (musicEnabled && isRunning && audioCtx) {
                    startMusic();
                    btnToggleMusic.style.opacity = '1';
                } else if (!musicEnabled && audioCtx) {
                    stopMusic();
                    btnToggleMusic.style.opacity = '0.55';
                }
            }

            // ==================== 启动/停止 ====================
            async function startSystem() {
                if (isRunning) return;

                btnStart.textContent = '⏳ 连接中...';
                btnStart.disabled = true;

                try {
                    resizeCanvas();
                    rebuildOffscreenCanvases();
                    initAudio();
                    await initMediaPipe();

                    btnStart.textContent = '🌙 觉醒中';
                    btnStart.classList.add('active-state');
                    btnStart.disabled = false;
                    statusLabel.textContent = '文物已唤醒';

                    if (musicEnabled && audioCtx) startMusic();
                } catch (err) {
                    console.error('启动失败:', err);
                    btnStart.textContent = '✨ 启程';
                    btnStart.disabled = false;
                    statusLabel.textContent = '启动失败，请重试';
                    isRunning = false;
                }
            }

            function stopSystem() {
                isRunning = false;

                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                    cameraStream = null;
                }
                if (handsInstance) {
                    try { handsInstance.close(); } catch (e) {}
                    handsInstance = null;
                }
                if (videoElement) {
                    videoElement.srcObject = null;
                }
                if (audioCtx && window._audioNodes) {
                    stopMusic();
                }

                detectedHands = [];
                smoothApertures = [];
                targetApertures = [];
                dustParticles = [];
                glowParticles = [];
                bloomParticles = [];
                bloomState.active = false;
                bloomState.intensity = 0;
                mainCanvas.classList.remove('bloom-active');

                btnStart.textContent = '✨ 启程';
                btnStart.classList.remove('active-state');
                btnStart.disabled = false;
                statusDot.classList.remove('active');
                statusLabel.textContent = '已停止';
                hintText.style.opacity = '0.8';
                memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                renderStaticFrame();
            }

            function renderStaticFrame() {
                const ctx = mainCtx;
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.drawImage(baseCanvas, 0, 0, canvasWidth, canvasHeight);
            }

            async function toggleCamera() {
                if (!isRunning) {
                    facingMode = facingMode === 'environment' ? 'user' : 'environment';
                    btnToggleCam.textContent = facingMode === 'environment' ? '📷 后置' : '📷 前置';
                    return;
                }

                stopSystem();
                facingMode = facingMode === 'environment' ? 'user' : 'environment';
                btnToggleCam.textContent = facingMode === 'environment' ? '📷 后置' : '📷 前置';
                await new Promise(r => setTimeout(r, 500));
                await startSystem();
            }

            // ==================== 事件处理 ====================
            btnStart.addEventListener('click', () => {
                if (isRunning) stopSystem();
                else startSystem();
            });

            uploadBase.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        userBaseImage = img;
                        drawImageCover(baseCtx, img, canvasWidth, canvasHeight, true);
                        memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                        if (!isRunning) renderStaticFrame();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            uploadMask.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        userMaskImage = img;
                        drawImageCover(maskCtx, img, canvasWidth, canvasHeight, false);
                        memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                        if (!isRunning) renderStaticFrame();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            btnReset.addEventListener('click', () => {
                userBaseImage = null;
                userMaskImage = null;
                uploadBase.value = '';
                uploadMask.value = '';
                rebuildOffscreenCanvases();
                memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                if (!isRunning) renderStaticFrame();
                statusLabel.textContent = isRunning ? '文物已唤醒' : '已重置';
            });

            btnToggleCam.addEventListener('click', toggleCamera);
            btnToggleMusic.addEventListener('click', toggleMusic);

            window.addEventListener('resize', () => {
                resizeCanvas();
                if (!isRunning) renderStaticFrame();
            });

            window.addEventListener('keydown', (e) => {
                switch (e.key.toLowerCase()) {
                    case 's':
                        if (!isRunning) startSystem();
                        else stopSystem();
                        break;
                    case 'r':
                        userBaseImage = null;
                        userMaskImage = null;
                        uploadBase.value = '';
                        uploadMask.value = '';
                        rebuildOffscreenCanvases();
                        memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                        if (!isRunning) renderStaticFrame();
                        break;
                    case 'm':
                        toggleMusic();
                        break;
                    case 'c':
                        toggleCamera();
                        break;
                    case 'f':
                        if (document.fullscreenElement) document.exitFullscreen();
                        else appContainer.requestFullscreen().catch(() => {});
                        break;
                }
            });

            window.addEventListener('beforeunload', () => {
                if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                if (handsInstance) try { handsInstance.close(); } catch (e) {}
                if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
            });

            // ==================== 初始化 ====================
            function init() {
                resizeCanvas();
                rebuildOffscreenCanvases();
                memoryCtx.clearRect(0, 0, canvasWidth, canvasHeight);
                renderStaticFrame();
                statusDot.classList.remove('active');
                statusLabel.textContent = '等待启程';
                hintText.style.opacity = '0.8';
                btnStart.textContent = '✨ 启程';
                btnStart.classList.remove('active-state');
                btnStart.disabled = false;
                btnToggleCam.textContent = facingMode === 'environment' ? '📷 后置' : '📷 前置';
                btnToggleMusic.textContent = '🎵';
                lastFrameTime = performance.now();

                requestAnimationFrame(function loop(ts) {
                    if (isRunning) {
                        // 渲染由render函数处理
                    } else {
                        lastFrameTime = ts;
                    }
                    requestAnimationFrame(loop);
                });
            }

            init();

            console.log('🏚️ 拂尘见秦腔 · 跨时空文物唤醒');
            console.log('  举起手掌拂去尘埃 | 双手合拢唤醒秦腔');
            console.log('  快捷键: S=启动/停止 R=重置 C=切换摄像头 M=音乐开关 F=全屏');
            console.log('  支持上传自定义底图和蒙版');
            console.log('  摄像头无镜像模式 - 手往左，灯往左');
        })();
    </script>
</body>
